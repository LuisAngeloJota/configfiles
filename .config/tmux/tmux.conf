unbind C-b
set -g prefix M-'\'
bind M-'\' send-prefix

set -g base-index 1
set -g pane-base-index 1
set -g status-position top
set -g status-left ""
set -g window-status-current-format " #I "
set -g window-status-current-style "bg=#8caaee,fg=#232634"
set -g window-status-format " #I "
set -g window-status-style "bg=#303446,fg=#c6d0f5"
set -g status-right " \U000f0379 #S "
set -g status-right-style "bg=#ca9ee6,fg=#232634"
set -g status-style "bg=#303446,fg=#c6d0f5,bold"
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
